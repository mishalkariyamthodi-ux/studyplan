<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f4d3a">
  <title>StudyPlan</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="images/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>StudyPlan</h1>
    <p id="status" aria-live="polite"></p>
  </header>
  <main>
    <form id="task-form">
      <input id="title" placeholder="What do you need to study?" required maxlength="80" aria-label="Task title">
      <select id="subject" aria-label="Subject">
        <option>Mathematics</option><option>Programming</option>
        <option>Languages</option><option>Other</option>
      </select>
      <input id="due" type="date" aria-label="Due date">
      <button type="submit">Add task</button>
    </form>

    <nav id="filters" aria-label="Filter tasks">
      <button data-f="all" class="on">All</button>
      <button data-f="open">To do</button>
      <button data-f="done">Done</button>
    </nav>

    <p id="summary"></p>
    <ul id="list"></ul>
    <p id="empty" hidden>No tasks yet. Add your first one above.</p>
  </main>
  <button id="install" hidden>Install app</button>
  <script src="app.js"></script>
</body>
</html>
